# cPanel Git deployment ("Deploy HEAD Commit" after "Update from Remote").
# deploy.sh copies the site files into the live folder. It never touches
# the live .htaccess (IT's CloudFront origin lock lives there and the file
# is maintained by hand on the server), and keeps files that exist only on
# the server.
#
# Server setup, once:
#  - The cPanel repository path must be OUTSIDE the live folder,
#    e.g. /home/<account>/repositories/peopleshr-dev
#  - Confirm the live folder path below.
deployment:
  tasks:
    - /bin/bash ./deploy.sh "$HOME/origin.peopleshr.com"
