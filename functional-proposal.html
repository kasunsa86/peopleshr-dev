<?php
/**
 * /functional-proposal/ goes straight to the Functional Proposal PDF (the
 * old viewer page is in git history). Done here rather than in .htaccess so
 * it deploys with the site; the live .htaccess is maintained by hand.
 *
 * 302, not 301: browsers cache a 301 indefinitely, and this target changes
 * whenever a new version of the PDF is uploaded -- update the path below.
 * The short s-maxage lets CloudFront pick up such a change within an hour.
 */
header('Cache-Control: public, max-age=0, s-maxage=3600');
header('X-Robots-Tag: noindex');
header('Location: /uploads/2026/06/PeoplesHR-Functional-Proposal_v10.2_2026.pdf', true, 302);
exit;
